<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AyazaFeciPompa</title>

    <style>
        body {
            background-color: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #38bdf8;
            font-size: 42px;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 12px 24px;
            background-color: #38bdf8;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Ayaza totten</h1>
    <p id="yazi">kralinigotten</p>

    <button onclick="ayazagirme()">Ayaza arkadan gir</button>

    <script>
        let sayac = 0;
       function ayazagirme() {
        sayac = sayac + 1;
        document.getElementById("yazi").textContent = "ayaza pompa calisiyor!";
        document.getElementById("yazi").textContent = "ayaza arkadan girme sayaci: " + sayac;
       }
    </script>
</body>
</html>
