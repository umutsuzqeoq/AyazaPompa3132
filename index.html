<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AyazaFeciPompa</title>

    <style>
        body {
            background-image: url("arkaplan.jpg");
            background-size: cover;
            background-position: center ;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #38bdf8;
            font-size: 42px;
        }
        
h1 {
    animation: neon 2s ease-in-out infinite alternate;
}

@keyframes neon {
    from {
        text-shadow: 0 0 5px #38bdf8;
    }
    to {
        text-shadow: 0 0 25px #38bdf8, 0 0 45px #a855f7;
    }
}


        p {
            font-size: 20px;
        }

        button {
            padding: 12px 24px;
            background-color: #38bdf8;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        
button {
    transition: transform 0.3s ease, background-color 0.3s ease;
}

button:hover {
    transform: scale(1.1);
    background-color: #a855f7;
}

    </style>
</head>
<body>
    <h1>Ayaza totten</h1>
    <p id="yazi">kralinigotten</p>

    <button onclick="ayazagirme()">Ayaza arkadan gir</button>

    <script>
        let sayac = 0;
       let ahhh = new Audio("uh-roblox-death-sound.mp3"); 
       function ayazagirme() {
        sayac = sayac + 1;
       ahhh.currentTime = 0;
ahhh.play(); 
        document.getElementById("yazi").textContent = "ayaza pompa calisiyor!";
        document.getElementById("yazi").textContent = "ayaza arkadan girme sayaci: " + sayac;
       }
    </script>
</body>
</html>
